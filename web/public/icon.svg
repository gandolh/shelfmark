<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Shelfmark's icon: books on a shelf, in the accent on the ground
       (design.md: #0E6E8C on #F5F5F3). Spines of different widths and heights,
       the last one leaning on its neighbour, so it reads as books and not as a
       chart. The mark stays inside the maskable safe zone (a circle of 40% of
       the size around the centre), so the same image serves as the maskable
       icon. No text, no gradients. -->
  <rect width="512" height="512" fill="#F5F5F3"/>
  <g fill="#0E6E8C">
    <rect x="136" y="138" width="58" height="226" rx="8"/>
    <rect x="202" y="168" width="38" height="196" rx="8"/>
    <rect x="248" y="128" width="60" height="236" rx="8"/>
    <rect x="359" y="168" width="40" height="196" rx="8" transform="rotate(-15 359 364)"/>
    <rect x="112" y="364" width="288" height="20" rx="10"/>
  </g>
  <!-- The labels that make them shelfmarks: a band low on three spines. -->
  <g fill="#F5F5F3">
    <rect x="136" y="314" width="58" height="18"/>
    <rect x="248" y="314" width="60" height="18"/>
    <rect x="359" y="314" width="40" height="18" transform="rotate(-15 359 364)"/>
  </g>
</svg>
