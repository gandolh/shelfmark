# Shelfmark's API. Build context is the repo root (..) because the image needs the
# root lockfile and every workspace manifest.
#
#   docker compose -f infrastructure/docker-compose.yml up -d shelfmark-api
#
# `.env` in THIS directory is written by the deploy (vps-deploy's `server`
# phase, 0600) and is read twice: compose interpolates ${...} below from it, and
# the service declares it as env_file so the same values reach the process.
# For a local run, copy PUBLIC_ORIGIN and the WARD_OIDC_ values from the repo's
# `.env`. It is git-ignored because it carries Shelfmark's Ward client key. In a
# container behind a proxy, also set AUTH_TRUSTED_PROXIES to the proxy's range.
# The backup route writes a temp copy of the database to the container's /tmp,
# so keep free disk about the size of the database.
services:
  shelfmark-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: shelfmark-api:1.0
    ports:
      # LOOPBACK ONLY. Without the 127.0.0.1 prefix this would be published on
      # every interface, reachable over plain HTTP past Caddy and its TLS. The
      # server's HOST is 0.0.0.0 because that is inside the container's network
      # namespace; this line is what decides who can reach it.
      - "127.0.0.1:${SHELFMARK_PORT:-8796}:${SHELFMARK_PORT:-8796}"
    env_file:
      - .env
    # These beat env_file. A dev .env copied here (HOST=127.0.0.1, PORT=8808,
    # DATA_DIR=./data) would otherwise override the image's ENV and leave the
    # server unreachable from the published port, or writing outside /data.
    # PORT follows SHELFMARK_PORT so the publish line, the healthcheck and the
    # listening port always agree.
    environment:
      HOST: 0.0.0.0
      PORT: "${SHELFMARK_PORT:-8796}"
      DATA_DIR: /data
    volumes:
      # The book database and covers. Bind-mounted from the host so it survives deploys
      # and "back up Shelfmark" means one path. Defaults to a local dir so a dev
      # `compose up` works.
      - ${SHELFMARK_DATA_DIR:-../data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${SHELFMARK_PORT:-8796}/api/health\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
